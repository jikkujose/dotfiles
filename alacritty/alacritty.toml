# Alacritty Configuration
# Cross-platform terminal config matching iTerm2/nvim setup

[general]
live_config_reload = true
import = [
  "themes/dark.toml",
  "~/.local/state/alacritty/theme.toml",
]

[env]
TERM = "xterm-256color"

[window]
decorations = "None"
startup_mode = "Maximized"
dynamic_padding = true
opacity = 1.0

[window.padding]
x = 8
y = 8

[scrolling]
history = 0  # Stateless - no scrollback

[font]
size = 14.0

[font.normal]
family = "CaskaydiaCove Nerd Font"
style = "Regular"

[font.bold]
family = "CaskaydiaCove Nerd Font"
style = "Bold"

[font.italic]
family = "CaskaydiaCove Nerd Font"
style = "Italic"

[font.bold_italic]
family = "CaskaydiaCove Nerd Font"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "Off" }
vi_mode_style = { shape = "Block", blinking = "On" }

[selection]
save_to_clipboard = true

# URL/link handling
# Enables opening plain URLs and OSC 8 hyperlinks from terminal output.
[hints]
alphabet = "jfkdls;ahgurieowpq"

[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\\u0000-\\u001F\\u007F-\\u009F<>\"\\s{-}\\^⟨⟩`]+"
hyperlinks = true
post_processing = true
persist = false
command = { program = "sh", args = ["-c", "case \"$(uname -s)\" in Darwin) open \"$1\" ;; *) xdg-open \"$1\" >/dev/null 2>&1 ;; esac", "alacritty-open"] }
mouse = { enabled = true, mods = "None" }
binding = { key = "U", mods = "Control|Shift" }

# Keybindings (similar to iTerm2/tmux)
[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "Return"
mods = "Command|Shift"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key = "Equals"
mods = "Command"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Command"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Command"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "K"
mods = "Command"
action = "ClearHistory"

[[keyboard.bindings]]
key = "V"
mods = "Command"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Command"
action = "Copy"
