# Alacritty Configuration
# Cross-platform terminal config matching iTerm2/nvim setup

[env]
TERM = "xterm-256color"

[window]
decorations = "full"
startup_mode = "Maximized"
dynamic_padding = true
opacity = 1.0

[window.padding]
x = 8
y = 8

[scrolling]
history = 0  # Stateless - no scrollback

[font]
size = 14.0

[font.normal]
family = "CaskaydiaCove Nerd Font"
style = "Regular"

[font.bold]
family = "CaskaydiaCove Nerd Font"
style = "Bold"

[font.italic]
family = "CaskaydiaCove Nerd Font"
style = "Italic"

[font.bold_italic]
family = "CaskaydiaCove Nerd Font"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "Off" }
vi_mode_style = { shape = "Block", blinking = "On" }

[selection]
save_to_clipboard = true

# Tomorrow Night Bright color scheme (matches nvim)
[colors.primary]
background = "#000000"
foreground = "#eaeaea"

[colors.cursor]
text = "#000000"
cursor = "#eaeaea"

[colors.selection]
text = "#eaeaea"
background = "#424242"

[colors.normal]
black   = "#000000"
red     = "#d54e53"
green   = "#b9ca4a"
yellow  = "#e7c547"
blue    = "#7aa6da"
magenta = "#c397d8"
cyan    = "#70c0b1"
white   = "#eaeaea"

[colors.bright]
black   = "#969896"
red     = "#d54e53"
green   = "#b9ca4a"
yellow  = "#e7c547"
blue    = "#7aa6da"
magenta = "#c397d8"
cyan    = "#70c0b1"
white   = "#ffffff"

# Keybindings (similar to iTerm2/tmux)
[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "Return"
mods = "Command|Shift"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key = "Equals"
mods = "Command"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Command"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Command"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "K"
mods = "Command"
action = "ClearHistory"

[[keyboard.bindings]]
key = "V"
mods = "Command"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Command"
action = "Copy"
