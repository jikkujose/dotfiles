# Tomorrow Night Bright color scheme (matches nvim)

[colors.primary]
background = "#000000"
foreground = "#eaeaea"

[colors.cursor]
text = "#000000"
cursor = "#eaeaea"

[colors.selection]
text = "#eaeaea"
background = "#424242"

[colors.normal]
black   = "#000000"
red     = "#d54e53"
green   = "#b9ca4a"
yellow  = "#e7c547"
blue    = "#7aa6da"
magenta = "#c397d8"
cyan    = "#70c0b1"
white   = "#eaeaea"

[colors.bright]
black   = "#969896"
red     = "#d54e53"
green   = "#b9ca4a"
yellow  = "#e7c547"
blue    = "#7aa6da"
magenta = "#c397d8"
cyan    = "#70c0b1"
white   = "#ffffff"
