# Tomorrow Day light color scheme

[colors.primary]
background = "#ffffff"
foreground = "#4d4d4c"

[colors.cursor]
text = "#ffffff"
cursor = "#4d4d4c"

[colors.selection]
text = "#4d4d4c"
background = "#d6d6d6"

[colors.normal]
black   = "#1d1f21"
red     = "#c82829"
green   = "#718c00"
yellow  = "#eab700"
blue    = "#4271ae"
magenta = "#8959a8"
cyan    = "#3e999f"
white   = "#4d4d4c"

[colors.bright]
black   = "#8e908c"
red     = "#c82829"
green   = "#718c00"
yellow  = "#eab700"
blue    = "#4271ae"
magenta = "#8959a8"
cyan    = "#3e999f"
white   = "#1d1f21"
