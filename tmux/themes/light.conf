# Tomorrow Day tmux theme (matches ~/dotfiles/alacritty/themes/light.toml)
set-option -g status-style "bg=#d6d6d6,fg=#1d1f21"
set-option -g window-status-style "bg=#d6d6d6,fg=#4d4d4c"
set-option -g window-status-current-style "bg=#4271ae,fg=#ffffff,bold"
set-option -g message-style "bg=#4271ae,fg=#ffffff"
set-option -g pane-border-style "fg=#d6d6d6"
set-option -g pane-active-border-style "fg=#8e908c"
