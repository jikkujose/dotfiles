# Tomorrow Night Bright tmux theme (matches ~/dotfiles/alacritty/themes/dark.toml)
set-option -g status-style "bg=#262626,fg=#eaeaea"
set-option -g window-status-style "bg=#262626,fg=#969896"
set-option -g window-status-current-style "bg=#424242,fg=#ffffff,bold"
set-option -g message-style "bg=#424242,fg=#eaeaea"
set-option -g pane-border-style "fg=#424242"
set-option -g pane-active-border-style "fg=#969896"
