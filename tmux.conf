#!/usr/bin/zsh
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ',screen-256color:RGB'
set-option -sa terminal-features ',xterm-256color:RGB'
unbind C-b
# Dual prefix setup - both backtick and §
set-option -g prefix `
set-option -g prefix2 §
set-option -g focus-events on
bind ` send-prefix
bind § send-prefix -2
set-window-option -g pane-base-index 1
set -g base-index 1
set -g status-left-length 20
# set-option -g status-bg black
# set-option -g status-fg white
set -s escape-time 0
set -g status-right '%a %d %b | %I:%M %p '
setw -g clock-mode-style 12
# thyme
set-option -g status-right '#(cat ~/.thyme-tmux)  %a %d %b | %I:%M %p '
set -g status-interval 1
set-option -g pane-border-style fg=colour235
set-option -g pane-active-border-style fg=colour240
set-option -g renumber-windows on
set-option -g status-style bg=colour235,fg=white,dim
# Vi mode
set -g mode-keys vi
# intutive pane splitting
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind-key w run "tmux split-window -l 12 'zsh -ci fzf_windows'"
# pane resizing
bind k resize-pane -U 5
bind j resize-pane -D 5
bind h resize-pane -L 5
bind l resize-pane -R 5
# pane helpers
bind Space last-pane
bind = select-layout even-horizontal
# reload config
bind r source-file ~/.tmux.conf \; display "Reloaded .tmux.conf"
# Vi copy mode: v to select, y to copy
bind-key -T copy-mode-vi v send -X begin-selection
if-shell "uname | grep -q Darwin" \
  "bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'" \
  "bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -selection clipboard'"

# send prefix to inner tmux
bind-key a send-prefix
bind k copy-mode \; send-keys -X search-backward "●" \; send-keys -X -N 20 scroll-down
